name: handydandy
version: 0.2.2
manifest_version: 2
api_version: 1
description: Sessions that hand off to themselves. Past a size limit the agent writes a handoff and (optionally) a fresh session starts from it.
author: Deploy Axiom
license: MIT
homepage: https://github.com/deployaxiom/handydandy
tags: [sessions, handoff, context, compaction, productivity]
requires_hermes: ">=0.21.4"
platforms: [macos, linux]
provides_hooks:
  - pre_api_request
  - transform_llm_output
  - pre_llm_call
config_schema:
  mode:
    type: str
    choices: [advise, handoff, relay]
    default: advise
    label: Mode
    description: "advise = one notice; handoff = the agent writes a handoff file; relay = handoff plus a fresh session starts from it."
  max_input_tokens:
    type: int
    default: 100000
    label: Token limit
    description: Estimated input tokens per request that count as too long (0 turns this check off).
  context_fraction:
    type: float
    default: 0.5
    label: Context share limit
    description: Share of the model's context window that counts as too long (0 turns this check off).
  max_messages:
    type: int
    default: 60
    label: Message limit
    description: Messages in the conversation that count as too long (0 turns this check off).
  context_limit:
    type: int
    default: 0
    label: Context window override
    description: Context window in tokens. 0 asks Hermes for the active model's window.
  handoff_dir:
    type: str
    default: ""
    label: Handoff folder
    description: Where handoff files go. Empty uses <HERMES_HOME>/handoffs.
  session_log_csv:
    type: str
    default: ""
    label: Session log CSV
    description: Optional CSV that gets one row per handoff (timestamp, profile, session_id, summary, handoff_path).
  relay_dry_run:
    type: bool
    default: true
    label: Relay dry run
    description: In relay mode, log the command that would start the fresh session instead of running it.
  relay_platforms:
    type: list
    default: [cli, tui, desktop]
    label: Relay channels
    description: Channels where relay may start a fresh session. Messaging channels are left out on purpose.
  relay_cooldown_minutes:
    type: int
    default: 30
    label: Relay cooldown (minutes)
    description: Minimum gap between automatic restarts across all sessions.
  relay_timeout_minutes:
    type: int
    default: 20
    label: Relay time limit (minutes)
    description: A fresh session started by relay is stopped if it runs longer than this.
  hermes_command:
    type: str
    default: ""
    label: Hermes command
    description: Path to the hermes launcher. Empty uses the first one on PATH.
