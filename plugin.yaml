name: handydandy
version: 0.3.0
manifest_version: 2
api_version: 1
description: Session-size notices and structured handoffs. You start the next session yourself.
author: Deploy Axiom
license: MIT
homepage: https://github.com/percyhendrux123-prog/hermes-handydandy
tags: [sessions, handoff, context, compaction, productivity]
requires_hermes: ">=0.22.5"
platforms: [macos, linux]
provides_hooks:
  - pre_api_request
  - transform_llm_output
  - pre_llm_call
config_schema:
  mode:
    type: str
    choices: [advise, handoff]
    default: advise
    label: Mode
    description: "advise = one notice; handoff = the agent writes a handoff file for you to open in a new session."
  max_input_tokens:
    type: int
    default: 100000
    label: Token limit
    description: Estimated input tokens per request that count as too long (0 turns this check off).
  context_fraction:
    type: float
    default: 0.5
    label: Context share limit
    description: Share of the model's context window that counts as too long. Requires context_limit above 0; 0 turns this check off.
  max_messages:
    type: int
    default: 60
    label: Message limit
    description: Messages in the conversation that count as too long (0 turns this check off).
  context_limit:
    type: int
    default: 0
    label: Context window
    description: Set the model's context window in tokens to enable the percentage check. 0 leaves it unavailable; token and message checks still work.
  handoff_dir:
    type: str
    default: ""
    label: Handoff folder
    description: Where handoff files go. Empty uses <HERMES_HOME>/handoffs.
  session_log_csv:
    type: str
    default: ""
    label: Session log CSV
    description: Optional CSV that gets one row per handoff (timestamp, profile, session_id, summary, handoff_path).
